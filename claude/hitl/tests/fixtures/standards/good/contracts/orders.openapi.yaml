# OpenAPI 3.1 — https://spec.openapis.org/oas/v3.1.1.html
openapi: 3.1.1
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The order, content: { application/json: { schema: { $ref: "order.schema.json" } } } }
        "404": { description: No such order }
